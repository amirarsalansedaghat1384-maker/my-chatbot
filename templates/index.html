<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>چت‌بات من</title>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: 'Tahoma', 'Segoe UI', sans-serif;
        background: #f0f2f5;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    .app-container {
        width: 100%;
        max-width: 600px;
        height: 90vh;
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
    }
    .chat-header {
        background: #6c47ff;
        color: white;
        padding: 12px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
    }
    .chat-title {
        font-size: 16px;
        font-weight: bold;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
    }
    .header-btn {
        background: rgba(255,255,255,0.2);
        border: none;
        color: white;
        padding: 6px 10px;
        border-radius: 8px;
        font-size: 12px;
        cursor: pointer;
        white-space: nowrap;
    }
    .header-btn:hover {
        background: rgba(255,255,255,0.35);
    }
    .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    .message {
        max-width: 75%;
        padding: 10px 14px;
        border-radius: 14px;
        line-height: 1.5;
        white-space: pre-wrap;
    }
    .user {
        background: #6c47ff;
        color: white;
        align-self: flex-start;
        border-bottom-left-radius: 4px;
    }
    .assistant {
        background: #e9e9eb;
        color: #333;
        align-self: flex-end;
        border-bottom-right-radius: 4px;
    }
    .chat-input {
        display: flex;
        padding: 12px;
        border-top: 1px solid #ddd;
        gap: 8px;
    }
    .chat-input input {
        flex: 1;
        padding: 10px 14px;
        border-radius: 20px;
        border: 1px solid #ccc;
        font-size: 15px;
        outline: none;
    }
    .chat-input button {
        background: #6c47ff;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 20px;
        cursor: pointer;
        font-size: 15px;
    }
    .chat-input button:hover {
        background: #5636d6;
    }
    .attach-btn {
        background: #eee;
        color: #6c47ff;
        border: none;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 18px;
        flex-shrink: 0;
    }
    .attach-btn:hover {
        background: #e2e2e2;
    }
    .image-preview-bar {
        display: none;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-top: 1px solid #ddd;
        background: #f8f8f8;
    }
    .image-preview-bar.show {
        display: flex;
    }
    .image-preview-bar img {
        height: 50px;
        border-radius: 8px;
    }
    .image-preview-bar .remove-img {
        border: none;
        background: #eee;
        border-radius: 50%;
        width: 24px;
        height: 24px;
        cursor: pointer;
        font-size: 13px;
    }
    .msg-image {
        max-width: 100%;
        border-radius: 10px;
        margin-bottom: 6px;
        display: block;
    }
    .loading {
        align-self: flex-end;
        color: #999;
        font-size: 13px;
    }
    .empty-state {
        margin: auto;
        color: #999;
        text-align: center;
        font-size: 14px;
    }

    /* پنل لیست مکالمات */
    .sidebar-overlay {
        position: absolute;
        top: 0; right: 0; bottom: 0; left: 0;
        background: rgba(0,0,0,0.4);
        display: none;
        z-index: 10;
    }
    .sidebar-overlay.open { display: block; }
    .sidebar {
        position: absolute;
        top: 0; right: 0; bottom: 0;
        width: 78%;
        max-width: 300px;
        background: white;
        transform: translateX(100%);
        transition: transform 0.2s ease;
        display: flex;
        flex-direction: column;
        z-index: 11;
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar-header {
        padding: 16px;
        font-weight: bold;
        border-bottom: 1px solid #eee;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .sidebar-list {
        flex: 1;
        overflow-y: auto;
    }
    .chat-item {
        padding: 12px 16px;
        border-bottom: 1px solid #f0f0f0;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
    }
    .chat-item:hover, .chat-item.active {
        background: #f5f3ff;
    }
    .chat-item-title {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
    }
    .delete-chat-btn {
        border: none;
        background: none;
        color: #c00;
        font-size: 14px;
        cursor: pointer;
        padding: 4px 8px;
    }
    .new-chat-btn-sidebar {
        margin: 12px;
        padding: 10px;
        background: #6c47ff;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
    }
</style>
</head>
<body>

<div class="app-container">
    <div class="chat-header">
        <button class="header-btn" onclick="toggleSidebar(true)">☰ مکالمات</button>
        <div class="chat-title" id="chatTitle">مکالمه جدید</div>
        <button class="header-btn" onclick="startNewChat()">➕ چت جدید</button>
    </div>
    <div class="chat-messages" id="messages"></div>
    <div class="image-preview-bar" id="imagePreviewBar">
        <img id="imagePreviewImg" src="" alt="پیش‌نمایش">
        <span style="font-size:12px;color:#666;">عکس آماده ارسال</span>
        <button class="remove-img" onclick="removeSelectedImage()">✕</button>
    </div>
    <div class="chat-input">
        <button class="attach-btn" onclick="document.getElementById('imageInput').click()">📎</button>
        <input type="file" id="imageInput" accept="image/*" style="display:none" onchange="handleImageSelect(event)">
        <input type="text" id="userInput" placeholder="پیامتو بنویس..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">ارسال</button>
    </div>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar(false)"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span>مکالمات قبلی</span>
            <button class="header-btn" onclick="toggleSidebar(false)">✕</button>
        </div>
        <button class="new-chat-btn-sidebar" onclick="startNewChat()">➕ مکالمه جدید</button>
        <div class="sidebar-list" id="chatList"></div>
    </div>
</div>

<script>
let currentChatId = localStorage.getItem('currentChatId') || null;
let selectedImageData = null; // data URL عکس انتخاب‌شده

function addMessage(content, role) {
    const messagesDiv = document.getElementById('messages');
    const el = document.createElement('div');
    el.className = 'message ' + role;

    // content می‌تونه رشته ساده باشه یا آرایه‌ای شامل متن و عکس
    if (Array.isArray(content)) {
        let textPart = '';
        content.forEach(part => {
            if (part.type === 'image_url') {
                const img = document.createElement('img');
                img.src = part.image_url.url;
                img.className = 'msg-image';
                el.appendChild(img);
            } else if (part.type === 'text') {
                textPart = part.text;
            }
        });
        if (textPart) {
            const textNode = document.createElement('div');
            textNode.textContent = textPart;
            el.appendChild(textNode);
        }
    } else {
        el.textContent = content;
    }

    messagesDiv.appendChild(el);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function handleImageSelect(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
        selectedImageData = reader.result;
        document.getElementById('imagePreviewImg').src = selectedImageData;
        document.getElementById('imagePreviewBar').classList.add('show');
    };
    reader.readAsDataURL(file);
}

function removeSelectedImage() {
    selectedImageData = null;
    document.getElementById('imageInput').value = '';
    document.getElementById('imagePreviewBar').classList.remove('show');
}

function clearMessagesView() {
    document.getElementById('messages').innerHTML = '';
}

async function sendMessage() {
    const input = document.getElementById('userInput');
    const messagesDiv = document.getElementById('messages');
    const text = input.value.trim();
    if (!text && !selectedImageData) return;

    // نمایش پیام کاربر (متن + عکس اگه بود)
    if (selectedImageData) {
        addMessage([
            {type: 'image_url', image_url: {url: selectedImageData}},
            {type: 'text', text: text}
        ], 'user');
    } else {
        addMessage(text, 'user');
    }

    const imageToSend = selectedImageData;
    input.value = '';
    removeSelectedImage();

    const loadingEl = document.createElement('div');
    loadingEl.className = 'loading';
    loadingEl.textContent = 'در حال تایپ...';
    messagesDiv.appendChild(loadingEl);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;

    try {
        const res = await fetch('/chat', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({message: text, chat_id: currentChatId, image: imageToSend})
        });
        const data = await res.json();
        loadingEl.remove();

        if (data.error) {
            addMessage('خطا: ' + data.error, 'assistant');
        } else {
            addMessage(data.reply, 'assistant');
            if (data.chat_id && data.chat_id !== currentChatId) {
                currentChatId = data.chat_id;
                localStorage.setItem('currentChatId', currentChatId);
            }
            refreshChatList();
        }
    } catch (err) {
        loadingEl.remove();
        addMessage('خطا در ارتباط با سرور', 'assistant');
    }
}

async function startNewChat() {
    const res = await fetch('/chats/new', { method: 'POST' });
    const data = await res.json();
    currentChatId = data.chat_id;
    localStorage.setItem('currentChatId', currentChatId);
    clearMessagesView();
    document.getElementById('chatTitle').textContent = 'مکالمه جدید';
    toggleSidebar(false);
    refreshChatList();
}

async function switchToChat(chatId) {
    const res = await fetch('/chats/' + chatId);
    if (!res.ok) return;
    const data = await res.json();
    currentChatId = chatId;
    localStorage.setItem('currentChatId', currentChatId);
    clearMessagesView();
    data.messages.forEach(msg => addMessage(msg.content, msg.role === 'user' ? 'user' : 'assistant'));
    toggleSidebar(false);
    refreshChatList();
}

async function deleteChat(chatId, event) {
    event.stopPropagation();
    if (!confirm('این مکالمه پاک بشه؟')) return;
    await fetch('/chats/' + chatId, { method: 'DELETE' });
    if (chatId === currentChatId) {
        currentChatId = null;
        localStorage.removeItem('currentChatId');
        clearMessagesView();
        document.getElementById('chatTitle').textContent = 'مکالمه جدید';
    }
    refreshChatList();
}

async function refreshChatList() {
    const res = await fetch('/chats');
    const data = await res.json();
    const listEl = document.getElementById('chatList');
    listEl.innerHTML = '';

    if (data.chats.length === 0) {
        listEl.innerHTML = '<div style="padding:16px;color:#999;font-size:13px;">هنوز مکالمه‌ای نیست</div>';
        return;
    }

    data.chats.forEach(c => {
        const item = document.createElement('div');
        item.className = 'chat-item' + (c.id === currentChatId ? ' active' : '');
        item.onclick = () => switchToChat(c.id);

        const titleSpan = document.createElement('div');
        titleSpan.className = 'chat-item-title';
        titleSpan.textContent = c.title;

        const delBtn = document.createElement('button');
        delBtn.className = 'delete-chat-btn';
        delBtn.textContent = '🗑️';
        delBtn.onclick = (e) => deleteChat(c.id, e);

        item.appendChild(titleSpan);
        item.appendChild(delBtn);
        listEl.appendChild(item);

        if (c.id === currentChatId) {
            document.getElementById('chatTitle').textContent = c.title;
        }
    });
}

function toggleSidebar(open) {
    document.getElementById('sidebar').classList.toggle('open', open);
    document.getElementById('sidebarOverlay').classList.toggle('open', open);
}

async function init() {
    await refreshChatList();
    if (currentChatId) {
        const res = await fetch('/chats/' + currentChatId);
        if (res.ok) {
            const data = await res.json();
            data.messages.forEach(msg => addMessage(msg.content, msg.role === 'user' ? 'user' : 'assistant'));
            return;
        }
    }
    // اگه چت فعالی نبود، یکی جدید بساز
    startNewChat();
}

init();
</script>

</body>
</html>
